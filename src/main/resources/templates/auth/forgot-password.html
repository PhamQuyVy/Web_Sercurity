<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Quên mật khẩu')}"></head><body class="auth-page"><section class="auth-card"><h1>Quên mật khẩu</h1><form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email tài khoản</label><input type="email" th:field="*{email}"><small th:errors="*{email}"></small><button class="button full">Gửi OTP</button></form><p><a th:href="@{/login}">Về đăng nhập</a></p></section></body></html>
