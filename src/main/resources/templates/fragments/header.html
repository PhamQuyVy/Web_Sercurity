<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<header th:fragment="header" class="topbar retail-nav">
  <a class="brand" th:href="@{/}">UTEShop</a>
  <nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/products}">Sản phẩm</a><a th:href="@{/products/create}">Thêm sản phẩm</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/users}">Quản trị</a></nav>
  <form class="header-search" th:action="@{/products}" method="get"><input name="keyword" placeholder="Tìm sản phẩm"><button aria-label="Tìm kiếm">⌕</button></form>
  <div class="account" sec:authorize="isAuthenticated()"><img class="avatar" th:src="${#authentication.principal.imageUrl != null and !#strings.isEmpty(#authentication.principal.imageUrl) ? #authentication.principal.imageUrl : 'https://ui-avatars.com/api/?name=' + #authentication.name}" alt="Avatar"><div class="account-copy"><span th:text="${#authentication.principal.fullName}">User</span><small><span th:text="${#authentication.principal.username}">username</span> · <span th:text="${#authentication.principal.email}">email</span></small></div><form th:action="@{/logout}" method="post"><button class="link-button">Đăng xuất</button></form></div>
</header></body></html>
