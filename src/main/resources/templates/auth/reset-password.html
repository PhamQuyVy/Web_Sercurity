<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Đặt lại mật khẩu')}"></head><body class="auth-page"><section class="auth-card"><h1>Đặt lại mật khẩu</h1><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{email}"><label>Mã OTP</label><input th:field="*{otp}" maxlength="6"><small th:errors="*{otp}"></small><label>Mật khẩu mới</label><input type="password" th:field="*{password}"><small th:errors="*{password}"></small><label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}"><button class="button full">Đổi mật khẩu</button></form></section></body></html>
