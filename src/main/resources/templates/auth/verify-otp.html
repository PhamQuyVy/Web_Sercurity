<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Xác nhận OTP')}"></head><body class="auth-page"><section class="auth-card"><h1>Xác nhận OTP</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email</label><input type="email" th:field="*{email}" readonly><label>Mã OTP 6 số</label><input th:field="*{otp}" maxlength="6" inputmode="numeric"><small th:errors="*{otp}"></small><button class="button full">Kích hoạt</button></form>
<form th:action="@{/resend-register-otp}" method="post"><input type="hidden" name="email" th:value="${verifyOtpDTO.email}"><button class="button secondary full">Gửi lại OTP</button></form></section></body></html>
