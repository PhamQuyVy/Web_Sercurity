<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Đăng ký')}"></head><body class="auth-page"><section class="auth-card"><h1>Đăng ký</h1>
<form th:action="@{/register}" th:object="${registerDTO}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div>
<label>Username</label><input th:field="*{username}"><small th:errors="*{username}"></small><label>Email</label><input type="email" th:field="*{email}"><small th:errors="*{email}"></small><label>Họ tên</label><input th:field="*{fullName}"><small th:errors="*{fullName}"></small><label>Mật khẩu</label><input type="password" th:field="*{password}"><small th:errors="*{password}"></small><label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}"><button class="button full">Đăng ký và gửi OTP</button></form><p><a th:href="@{/login}">Về đăng nhập</a></p></section></body></html>
