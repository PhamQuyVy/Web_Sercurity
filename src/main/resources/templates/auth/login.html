<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Đăng nhập')}"></head><body class="auth-page"><section class="auth-card"><h1>Đăng nhập</h1>
<div th:if="${param.error}" class="alert error">Username/email hoặc mật khẩu không đúng, hoặc tài khoản chưa kích hoạt.</div><div th:if="${param.logout}" class="alert success">Bạn đã đăng xuất.</div><div th:if="${success}" class="alert success" th:text="${success}"></div>
<form th:action="@{/login}" method="post"><label>Username hoặc email</label><input name="username" required autofocus><label>Mật khẩu</label><input type="password" name="password" required><button class="button full">Đăng nhập</button></form>
<p><a th:href="@{/register}">Tạo tài khoản</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a></p></section></body></html>
